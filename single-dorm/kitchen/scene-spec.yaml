    - kit.ceiling.galvanised-duct
    - kit.ceiling.sprinkler-pipe
    - kit.ceiling.dome-camera
    - prop.island.double-stainless
    - prop.range.dual-wok
    - prop.steamer.three-door
    - prop.oven.double-door
    - prop.sink.triple
    - prop.prep-counter.heat-display
    - prop.cold-door.insulated
    - prop.freight-elevator.double-slide
    - prop.pass.double-impact-door
    - prop.door.dining.return
    - prop.crt.wall
    - prop.crt.floor
  oneoff:
    - "wall/floor CRT pair (two variants, scene-specific surveillance motif)"
    - "cold-room door heater wire + thermometer"
    - "freight elevator call panel/indicator"

budget:
