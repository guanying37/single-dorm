    label: 冷库
    type: portal-door
    sceneId: coldstore
    owner: kitchen
    spawn: [0.26, 2.3]
    transition: "black overlay, destination title, view recentered"

lighting:
  recipe: coldstore.led
  key:
    type: directional
    direction: down
    color: "#f1f9ff"
    intensity: 1.05
    castShadow: true
    shadowMap: 1024
    shadowBake: once
  fills:
    hemisphere: { sky: "#dfeef8", ground: "#4b585e", intensity: 0.34 }
    ambient: { color: "#eaf4ff", intensity: 0.06 }
    ledPoints: 2
    evaporator: 1
    crtGlow: 1
    heaterGlow: 1
    doorFill: 1
  fixtures:
    - "2 × moisture-proof explosion-proof LED cold luminaire (clear dust cover + condensation frost)"
    - "evaporator air cooler with two guarded fans"
    - "grey CRT with phosphor feed"
  exposure: 0.85
  postProcessing: none

assets:
  reuse:
    - "dining/src/utils.js: StaticBuilder, mergeGeometries, uvScaledPlane, trs, mulberry32"
    - "dining/src/collision.js: CollisionWorld"
    - "kitchen/src/geometry.js: frustumGeometry, crtScreenGeometry, roundedBoxGeometry"
    - "kitchen room: existing insulated cold-room door leaf (pick proxy only, geometry untouched)"
    - "single-dorm/styles.css + hub shell + local three.module.min.js"
  new:
    - kit.room.coldstore-shell.2.7x5.6
    - kit.wall.insulation-panel.white-brushed
    - kit.trim.panel-seam.silicone
    - kit.trim.corner-post.aluminium
    - kit.floor.aluminium-tread-deck
    - kit.floor.perimeter-drain-grate
    - kit.ceiling.pu-panel
    - kit.ceiling.led-cold-luminaire.frosted
    - kit.ceiling.evaporator.air-cooler
    - kit.ceiling.temperature-sensor
    - kit.ceiling.camera.defog-dome
    - kit.door.insulated-heavy.1.3x2.2
    - kit.door.emergency-release.glow
    - prop.shelf.stainless-heavy.4tier
    - prop.pan.stainless.food
    - prop.container.clear.food-grade
    - prop.carton.kraft.blank
    - prop.crt.wall.coldstore
    - prop.hygrothermometer.pointer
    - prop.rail.garment.cold-coat
    - prop.insulated-pipe.run
  oneoff:
    - "cold-store door leaf with internal emergency release, heater trace and frost rime"
    - "evaporator air cooler with guarded twin fans and drain"
    - "wall CRT + pointer hygrothermometer pair (cold-store surveillance motif)"
    - "cold-air particle layers (mist from evaporator + aisle haze)"

