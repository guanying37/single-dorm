<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17120f" />
  <title>ADV 3D 场景预览</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="stage" tabindex="0" aria-label="可切换的 ADV 三维场景"></canvas>

    <div class="ui-layer">
      <div class="top-bar chrome">
        <div class="identity">
          <span class="eyebrow" id="sceneEyebrow">ADV · INTERIOR</span>
          <h1 id="sceneTitle">场景</h1>
          <div class="status-row">
            <span class="fps-dot" id="fpsDot" aria-hidden="true"></span>
            <span class="fps-readout"><span>FPS</span><strong id="fpsValue">--</strong></span>
            <span class="rule" aria-hidden="true"></span>
            <span class="fps-readout" id="qualityLabel" style="opacity:.62">实时</span>
          </div>
        </div>

        <div class="scene-switch chrome" role="tablist" aria-label="场景切换">
          <button class="scene-tab is-active" type="button" role="tab" aria-selected="true" data-scene="dorm">宿舍</button>
          <button class="scene-tab" type="button" role="tab" aria-selected="false" data-scene="dining">餐厅</button>
        </div>

        <div class="top-actions">
          <button class="fullscreen-button" id="fullscreenButton" type="button" title="全屏（F11）">
            <span>全屏</span><span class="key">F11</span>
          </button>
        </div>
      </div>

      <div id="crosshair" aria-hidden="true"></div>

      <div class="interaction-badge" id="interactionBadge" role="status">
        <kbd>E</kbd>
        <span id="interactionText">互动</span>
      </div>

      <div class="toast" id="toast" role="status"></div>
      <div class="pointer-hint" id="lockHint" aria-hidden="true">
        <span class="pointer-hint-dot" aria-hidden="true"></span>
        <span id="lockHintText">点击画面捕获鼠标 · 右键固定视野 · 中键回正</span>
      </div>

      <div class="bottom-bar chrome">
        <div class="control-strip" id="dormControls">
          <div class="control-item"><span class="keycap">LMB</span><span>拖动环顾</span></div>
          <div class="control-item"><span class="keycap">E</span><span>互动</span></div>
          <div class="control-item"><span class="keycap">MMB</span><span>回正</span></div>
        </div>
        <div class="control-strip is-hidden" id="diningControls">
          <div class="control-item"><span class="keycap">WASD</span><span>移动</span></div>
          <div class="control-item"><span class="keycap">Shift</span><span>加速</span></div>
          <div class="control-item"><span class="keycap">鼠标</span><span>环顾</span></div>
          <div class="control-item"><span class="keycap">E</span><span>互动</span></div>
          <div class="control-item"><span class="keycap">MMB</span><span>回正</span></div>
        </div>
      </div>
    </div>

    <div id="loader">
      <div class="loader-inner">
        <p class="loader-title">正在布置场景</p>
        <p class="loader-subtitle">PROCEDURAL INTERIOR</p>
      </div>
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.innerHTML = '<div class="loader-inner"><p class="loader-title">需要通过本地服务器打开</p><p class="loader-subtitle">双击 start-preview.cmd 或运行 python -m http.server 8123</p></div>';
        }
      }
    </script>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="./src/hub.js"></script>
</body>
</html>
