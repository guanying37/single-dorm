  depth: 8.0
  height: 3.0
  wallThickness: 0.2
  area: 40.0
  ratio: "5 : 8（宽 : 深）"
  grid: 0.25
  note: "设计图未随仓库提交图像文件；按用户 5:8 比例与图示关系落位。门在南墙偏东 x=+1.15，进门右手为东墙洗手池/药柜。"
  bedRow:
    beds: 5
    bed: "1.95 × 0.92 m，床头靠西墙"
    centersZ: [-3.15, -1.60, -0.05, 1.50, 3.05]
    pitch: 1.55
    gap: 0.63
  curtainDividersZ: [-2.60, -1.05, 0.50, 2.05, 3.60]
  mainAisle: "床尾 x=-0.51 → 药柜前 x=+2.09，约 2.60 m"
  treatmentAisle: "手术台东侧 x=+1.27 → 墙/柜前，约 1.0–1.2 m"

connections:
  - id: door.infirmary
    wall: south
    type: white painted timber door
    width: 0.95
    height: 2.18
    x: 1.15
    hinge: east
    sceneId: corridor
