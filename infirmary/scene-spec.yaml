mood: "白、亮、干净、略带无菌感；浅蓝隔帘与防撞扶手是唯一冷色大块面，绿萝与浅橡木药柜把空间拉回学校"
timeOfDay: "人工照明（无窗）"
weather: "不适用"

dimensions:
