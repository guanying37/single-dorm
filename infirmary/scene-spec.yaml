    roll: 0
    bob: { walk: 0.012, run: 0.022, frequency: 5.6, lateral: 0.45 }
    substep: 0.06
    collision: true
    colliderCount: 22
    testStops:
      bedRow: { x: -0.21, z: 1.50 }
      cabinet: { x: 1.78, z: 0.80 }
      sink: { x: 1.64, z: 3.34 }
      operatingTable: { x: 0.95, z: 0.095 }
      door: { x: 1.15, z: 3.68 }
      northWestCorner: { x: -1.54, z: -0.84 }

interactables:
  - id: door.infirmary
    label: 医务室门
    type: locked-door
    sceneId: corridor
    behavior: "toast: 医务室门 · 暂未开放（预留走廊切换）"
  - id: curtain.1
    label: 隔帘
    type: open-close
    behavior: "two pleated panels; open scale.x 0.5 at aisle end; closed scale.x 1 meeting at centre"
  - id: curtain.2
    label: 隔帘
    type: open-close
  - id: curtain.3
    label: 隔帘
    type: open-close
  - id: curtain.4
    label: 隔帘
    type: open-close
  - id: curtain.5
    label: 隔帘
    type: open-close
  - id: cabinet.glass
    label: 玻璃柜门
    type: slide
    behavior: "west glass panel slides 0.735 m behind the east panel"
  - id: cabinet.drawer.1
    label: 药柜抽屉
    type: pull-out
    behavior: "drawer slides 0.30 m toward the room; packages visible"
  - id: cabinet.drawer.2
    label: 药柜抽屉
    type: pull-out
  - id: cabinet.drawer.3
    label: 药柜抽屉
    type: pull-out
  - id: waste.bin
    label: 医疗废弃物桶
    type: lid
    behavior: "red lid hinged on the north edge opens to -1.15 rad"

lighting:
  recipe: infirmary.daylight-clinic
  key:
    type: directional
    direction: down
    color: "#fff7ea"
    intensity: 1.75
    castShadow: true
    shadowMap: 2048
    shadowBake: once
  fills:
    hemisphere: { sky: "#e7f1f4", ground: "#9aa5a0", intensity: 0.42 }
    ambient: { color: "#ffffff", intensity: 0.12 }
    ceilingPanels: { color: "#f1f8ff", intensity: 1.45, distance: 5.2, count: 3 }
    surgical: { color: "#fff2dc", intensity: 2.8, distance: 3.4 }
    cabinet: { color: "#fff7e8", intensity: 0.9, distance: 1.5 }
    basin: { color: "#eaf5f8", intensity: 0.7, distance: 2.6 }
    northBounce: { color: "#f2f7ee", intensity: 0.5, distance: 3.0 }
  fixtures:
    - "6 × 5000–6000K LED ceiling panels"
    - "ceiling surgical lamp: 6 emissive lenses + additive halo"
    - "warm light inside the glass medicine cabinet"
    - "mirror: one 128 px cube-map bake"
    - "camera recording LED and display feed dot"
  exposure: 0.96
  postProcessing: none
  shadows:
    dynamicMeshesCastShadow: false
    note: "curtains, glass panels, drawers, waste lid, display and halo do not cast"

assets:
  reuse:
    - "dining/src/utils.js: StaticBuilder, mergeGeometries, uvScaledPlane, trs, mulberry32"
    - "dining/src/collision.js: CollisionWorld"
    - "kitchen/src/geometry.js: roundedBoxGeometry, frustumGeometry, bowlGeometry"
    - "single-dorm/src/hub.js + styles.css + local vendor/three.module.min.js"
  new:
    - kit.room.infirmary.5x8x3.0
    - kit.wall.white-plaster
    - kit.floor.white-tile.600
    - kit.ceiling.white-panel
    - kit.trim.plaster-cornice.two-step
    - kit.skirting.white.100
    - kit.door.timber.white.0.95x2.18
    - kit.rail.bumper.pale-blue
    - kit.light.led-panel.5000k
    - kit.light.surgical.ceiling
    - kit.hvac.wall-split
    - kit.camera.wall.bullet
    - kit.display.wall-feed
    - prop.bed.mobile.clinic
    - prop.curtain.privacy.pleated
    - prop.cart.bedside.two-tier
    - prop.cabinet.medicine.glass-drawer
    - prop.cabinet.steel.tall
    - prop.basin.scrub-sink.single-bowl
    - prop.mirror.frameless
    - prop.soap.dispenser.sensor
    - prop.table.operating
    - prop.stand.instrument-tray
    - prop.instrument.set.clinic
    - prop.bin.medical-waste.pedal
    - prop.stool.doctor.round
    - prop.plant.pothos
  oneoff:
    - "medicine cabinet with sliding glass above and three pull-out oak drawers below"
    - "ceiling surgical lamp + operating table + instrument tray"
    - "five two-panel privacy curtains with a shared pleat geometry"

budget:
